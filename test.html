<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PPT API Test</title>
</head>
<body>
    <h2>Test PPT Extractor API (with Blob upload – manual)</h2>
    <input type="file" id="pptFile" accept=".ppt">
    <button onclick="uploadPPT()">Upload & Extract</button>
    <pre id="output" style="background:#f4f4f4; padding:10px; margin-top:20px; max-height:400px; overflow:auto;"></pre>

    <script>
        async function uploadPPT() {
            const fileInput = document.getElementById('pptFile');
            const file = fileInput.files[0];
            if (!file) {
                alert('Select a .ppt file first');
                return;
            }
            const output = document.getElementById('output');
            output.textContent = 'Uploading...';

            try {
                // Step 1: Get upload token from your backend
                const tokenResponse = await fetch('https://fluffy-succotash-blond.vercel.app/api/upload/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        path: file.name, 
                        clientPayload: JSON.stringify({ name: file.name }) 
                    })
                });
                const tokenData = await tokenResponse.json();
                if (!tokenData.url) {
                    throw new Error('No token URL returned: ' + JSON.stringify(tokenData));
                }

                // Step 2: Upload the file directly to the token URL (PUT request)
                const putResponse = await fetch(tokenData.url, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': file.type || 'application/octet-stream',
                        'x-vercel-token': tokenData.token,
                        'x-vercel-file-name': file.name
                    },
                    body: file
                });
                if (!putResponse.ok) {
                    throw new Error('Upload failed with status: ' + putResponse.status);
                }

                output.textContent = 'File uploaded successfully!\nProcessing will happen server-side.\nCheck the Vercel logs for extracted text.';
            } catch (e) {
                output.textContent = 'Error: ' + e.message;
            }
        }
    </script>
</body>
</html>
