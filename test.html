<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PPT API Test</title>
</head>
<body>
    <h2>Test PPT Extractor API (with Blob upload)</h2>
    <input type="file" id="pptFile" accept=".ppt">
    <button onclick="uploadPPT()">Upload & Extract</button>
    <pre id="output" style="background:#f4f4f4; padding:10px; margin-top:20px; max-height:400px; overflow:auto;"></pre>

    <!-- Load the Blob client library from CDN -->
    <script src="https://unpkg.com/@vercel/blob/client@0.23.0/dist/index.js"></script>
    <script>
        async function uploadPPT() {
            const fileInput = document.getElementById('pptFile');
            const file = fileInput.files[0];
            if (!file) {
                alert('Select a .ppt file first');
                return;
            }
            const output = document.getElementById('output');
            output.textContent = 'Uploading...';

            try {
                // Call the upload function from the Blob client
                // It will request a token from our server endpoint automatically
                const result = await upload(file, {
                    access: 'private', // or 'public' if you want
                    handleUploadUrl: 'https://fluffy-succotash-blond.vercel.app/api/upload/token',
                    clientPayload: JSON.stringify({ name: file.name })
                });

                output.textContent = 'File uploaded successfully! Processing will happen server-side.\nCheck server logs for extracted text.';
            } catch (e) {
                output.textContent = 'Error: ' + e.message;
            }
        }
    </script>
</body>
</html>
